<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Rectangle">
  <!-- 矩形 · A 族（构造类）
       细轮廓 + 对角两个方 grip。只标对角而不是四角：AutoCAD 的矩形同样是
       抓住一角拖出对角，四角全标会变成一团噪点。
       光学尺寸 19.8，工具栏级 18-22。 -->
  <rect x="3.2" y="4.6" width="17.6" height="14.8" rx="0.8" fill="none"
        stroke="#D8E0EA" stroke-width="1.4"/>
  <rect x="19.7" y="3.5" width="2.2" height="2.2" rx="0.4" fill="#4FA3F2"/>
  <rect x="2.1" y="18.3" width="2.2" height="2.2" rx="0.4" fill="#4FA3F2"/>
</svg>
