<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Layers">
  <!-- 图层 · B 族（实体类）
       三层菱形叠瓦：顶层 accent 实心（当前层），下面两层 muted 虚化。
       图层是有厚度的实体，所以允许实心填充；accent ≈ 74 单位² ≈ 12.8%，
       落在 B 族 18% 预算内。下面的层用 muted 而不是 neutral，是为了让"当前层"跳出来。
       光学尺寸 18.2，工具栏级 18-22。 -->
  <path d="M12 3.6 20.4 8.0 12 12.4 3.6 8.0 Z" fill="#4FA3F2"/>
  <path d="M12 3.6 20.4 8.0 12 12.4 3.6 8.0 Z" fill="none" stroke="#D8E0EA"
        stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M12 6.6 20.4 11.0 12 15.4 3.6 11.0 Z" fill="none" stroke="#8B96A6"
        stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M12 9.6 20.4 14.0 12 18.4 3.6 14.0 Z" fill="none" stroke="#8B96A6"
        stroke-width="1.3" stroke-linejoin="round"/>
</svg>
