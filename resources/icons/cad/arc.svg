<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Arc">
  <!-- 弧 · A 族（构造类）
       3/4 弧轮廓 + 两端方 grip + 一条 muted 虚线构造半径。
       虚线用 muted 而不是 accent：它是推导出来的辅助线，不是用户要抓的东西，
       把它降级才能让两个端点 grip 成为唯一焦点。
       圆心压到 y=15.2：弧的墨量天然偏上，抬高圆心才能把重心拉回画布中部，
       否则在工具栏里会明显往上飘。
       光学尺寸 18.25 × 9.9，工具栏级 18-22。 -->
  <path d="M3.4 15.2 A8.6 8.6 0 1 1 19.448 10.9" fill="none" stroke="#D8E0EA"
        stroke-width="1.4" stroke-linecap="round"/>
  <path d="M12 15.2 12 6.6" fill="none" stroke="#8B96A6" stroke-width="1.2"
        stroke-linecap="round" stroke-dasharray="2 1.6"/>
  <rect x="2.3" y="14.1" width="2.2" height="2.2" rx="0.4" fill="#4FA3F2"/>
  <rect x="18.348" y="9.8" width="2.2" height="2.2" rx="0.4" fill="#4FA3F2"/>
</svg>
