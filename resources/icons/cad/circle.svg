<svg xmlns="www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Circle">
  <!-- 圆 · A 族（构造类）
       轮廓圆 + 定义性半径线 + 圆心方 grip，三者同属"定心定半径"这一个焦点，
       允许由多个图元组成（accent 合计 16.9 单位² ≈ 2.9%）。
       半径线与圆心用同色，是因为它们是同一个语义焦点而不是两个强调。
       光学尺寸 18.6，工具栏级 18-22，重心严格 (12,12)。 -->
  <circle cx="12" cy="12" r="8.6" fill="none" stroke="#D8E0EA" stroke-width="1.4"/>
  <path d="M12 12 18.08 18.08" fill="none" stroke="#4FA3F2" stroke-width="1.4"
        stroke-linecap="round"/>
  <rect x="10.9" y="10.9" width="2.2" height="2.2" rx="0.4" fill="#4FA3F2"/>
</svg>
