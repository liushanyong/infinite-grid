<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Polyline">
  <!-- 多段线 · A 族（构造类）
       四段折线的轮廓线 + 三个顶点方 grip。accent 面积 3 x 5.8 ≈ 3.0%，
       落在"折点"这一语义焦点上；末段不加 grip，避免小尺寸下抢视觉。
       光学尺寸 18.0，工具栏级 18-22。 -->
  <path d="M3.6 17.2 9.0 11.2 15.0 17.6 20.4 9.0" fill="none" stroke="#D8E0EA"
        stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="2.5" y="16.1" width="2.2" height="2.2" rx="0.4" fill="#4FA3F2"/>
  <rect x="7.9" y="10.1" width="2.2" height="2.2" rx="0.4" fill="#4FA3F2"/>
  <rect x="18.3" y="7.9" width="2.2" height="2.2" rx="0.4" fill="#4FA3F2"/>
</svg>
