<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Viewport">
  <!-- 视口 · B 族（实体类）
       neutral 外层"屏幕" + accent 虚线内框（活动视口边界）+ neutral 一条模型几何。
       内框用虚线：视口边界是导出的推导线，不是用户要抓的实体；
       但它必须用 accent，因为"当前视口"正是这个命令要切换的对象。
       accent ≈ 25 单位² ≈ 4.3%（虚线后）。
       光学尺寸 17.9 / 14.5，状态栏级 14-18。 -->
  <rect x="3.8" y="4.8" width="16.4" height="13.0" rx="1.2" fill="none"
        stroke="#D8E0EA" stroke-width="1.5"/>
  <rect x="6.6" y="7.2" width="10.8" height="8.2" fill="none" stroke="#4FA3F2"
        stroke-width="1.3" stroke-dasharray="2.4 1.8"/>
  <path d="M8.8 11.4 13.6 11.4" fill="none" stroke="#D8E0EA" stroke-width="1.2"
        stroke-linecap="round"/>
</svg>
