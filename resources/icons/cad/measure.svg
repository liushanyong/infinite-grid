<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Measure">
  <!-- 测量 · A 族（构造类）
       45 度钢尺轮廓 + 单侧刻度。首尾两道刻度用 accent（"被测的那一段"），
       中间一道用 muted。这是刻度尺读数惯例，也避免了整把尺子变成蓝色。
       旋转换算：45 度会把包围盒压成 (L+W)/sqrt2，反推 L+W ≈ 27 才能旋转后达到 19。
       光学尺寸 20.9，工具栏级 18-22。 -->
  <rect x="1.2" y="9.0" width="21.6" height="6.0" rx="0.8" fill="none"
        stroke="#D8E0EA" stroke-width="1.5" transform="rotate(-45 12 12)"/>
  <path d="M5.212 14.546 6.555 15.889" fill="none" stroke="#4FA3F2" stroke-width="1.8"
        stroke-linecap="round"/>
  <path d="M11.434 8.323 12.778 9.667" fill="none" stroke="#4FA3F2" stroke-width="1.8"
        stroke-linecap="round"/>
  <path d="M8.323 11.434 9.667 12.778" fill="none" stroke="#8B96A6" stroke-width="1.3"
        stroke-linecap="round"/>
</svg>
