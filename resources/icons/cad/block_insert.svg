<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Insert block">
  <!-- 插入块 · B 族（实体类）
       与 block_make 共用同一个立方体剪影，但顶面不填色 —— 块不是新的，
       它是从别处进来的。区别只靠 accent 箭头"送进来"这一件事来表达。
       accent ≈ 8.7 单位² ≈ 1.5%，刻意压得很低。
       光学尺寸 19.1，工具栏级 18-22。 -->
