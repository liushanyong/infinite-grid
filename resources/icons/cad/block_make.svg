<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Create block">
  <!-- 创建块 · B 族（实体类）
       等轴测立方体：顶面 accent 实心（"刚造出来的那一块"），左右两面只留 neutral 轮廓。
       实心=有体积，块本身就是一个实体，所以它属于 B 族而不是 A 族；
       参考集里 block_new 的 accent 占比高达 44%，这里收到 14% 以适配 26px。
       光学尺寸 18.2 / 18.6，工具栏级 18-22。 -->
  <path d="M12 3.5 3.6 8.3 12 13.1 20.4 8.3 Z" fill="#4FA3F2"/>
  <path d="M12 3.5 3.6 8.3 12 13.1 20.4 8.3 Z" fill="none" stroke="#D8E0EA"
        stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M3.6 8.3 12 13.1 12 20.7 3.6 15.9 Z" fill="none" stroke="#D8E0EA"
        stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M20.4 8.3 12 13.1 12 20.7 20.4 15.9 Z" fill="none" stroke="#D8E0EA"
        stroke-width="1.4" stroke-linejoin="round"/>
</svg>
