<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Open folder">
  <!-- 打开 · B 族（实体类）
       accent 文件从 neutral 文件夹后面探出来。实心 = 有体积，这是参考集里实体类的做法；
       accent 只给"被打开的那份文件"，可见面积 ≈ 40 单位² ≈ 7.0%，在 18% 预算内。
       注意文件轮廓必须断在文件夹顶边上：运行时所有填充先画、所有描边后画，
       不截断的话被遮住的轮廓会浮在文件夹表面。
       光学尺寸 18.2 / 17.9，工具栏级 18-22。 -->
