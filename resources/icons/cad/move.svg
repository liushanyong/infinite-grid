        stroke-linecap="round"/>
  <path d="M10.0 12 6.0 12" fill="none" stroke="#D8E0EA" stroke-width="1.5"
        stroke-linecap="round"/>
  <path d="M14.0 12 18.0 12" fill="none" stroke="#D8E0EA" stroke-width="1.5"
        stroke-linecap="round"/>
  <path d="M12 2.4 14.4 5.6 9.6 5.6 Z" fill="#D8E0EA"/>
  <path d="M12 21.6 9.6 18.4 14.4 18.4 Z" fill="#D8E0EA"/>
