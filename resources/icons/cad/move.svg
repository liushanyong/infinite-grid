  <!-- 移动 · A 族（构造类）
       四向箭头 + 中心 accent 方 grip。accent 只给中心点 ≈ 9 单位² ≈ 1.6%：
       移动命令的焦点是"被抓住的那个点"，不是箭头本身。
       光学尺寸 19.2，工具栏级 18-22，重心严格 (12,12)。 -->
