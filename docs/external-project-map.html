:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c232c; --line:#2a323d;

  --ok:#3fb950; --warn:#d29922; --bad:#f85149; --unk:#6e7681;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--panel);

.sub{color:var(--dim);font-size:12px}
.sub code{background:var(--panel2);padding:1px 5px;border-radius:3px;color:var(--accent)}
#search{width:100%;margin-top:12px;padding:9px 12px;background:var(--bg);

.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.chip:hover{border-color:var(--dim);color:var(--fg)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
main{display:grid;grid-template-columns:390px 1fr;gap:0;height:calc(100vh - 148px)}
#list{border-right:1px solid var(--line);overflow-y:auto;padding:8px}
#detail{overflow-y:auto;padding:20px 26px}
.item{padding:9px 11px;border:1px solid transparent;border-radius:6px;cursor:pointer;margin-bottom:3px}
.item:hover{background:var(--panel)}
.item.sel{background:var(--panel2);border-color:var(--accent)}
.item .t{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.item .m{color:var(--dim);font-size:11px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.b-permissive{background:var(--ok)} .b-weak_copyleft{background:var(--warn)}
.b-strong_copyleft{background:var(--bad)} .b-unknown{background:var(--unk)}
h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);
  margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--dim);width:118px;white-space:nowrap}
ul{margin:6px 0;padding-left:20px} li{margin:3px 0}
.tag{display:inline-block;padding:1px 7px;margin:2px 3px 2px 0;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;font-size:11px;color:var(--dim)}
.pill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.p-permissive{background:rgba(63,185,80,.15);color:var(--ok)}
.p-weak_copyleft{background:rgba(210,153,34,.15);color:var(--warn)}
.p-strong_copyleft{background:rgba(248,81,73,.15);color:var(--bad)}
.p-unknown{background:rgba(110,118,129,.2);color:var(--unk)}
.edge{border-left:2px solid var(--accent);padding:6px 0 6px 11px;margin:8px 0;background:var(--panel)}
.edge .ty{color:var(--accent);font-size:11px;font-weight:600}
.edge .nt{font-size:12px;color:var(--dim);margin-top:2px}
.badge{display:inline-block;padding:1px 7px;border-radius:3px;background:var(--panel2);
  border:1px solid var(--line);font-size:10.5px;color:var(--dim);margin-left:5px}
.hi{background:rgba(88,166,255,.25);border-radius:2px}
.ev{font-size:11.5px;color:var(--unk);font-family:ui-monospace,Consolas,monospace}
#empty{padding:40px;color:var(--dim);text-align:center}
@media(max-width:900px){main{grid-template-columns:1fr;height:auto}#list{border-right:none}}
</style>
</head>

{f:"infinite-grid",t:"predicates",ty:"compiled-in",st:"active",w:5,n:"CMakeLists.txt:201-215 —— 唯一真正被编译进 WINDOW target 的 external/ 项目。强制 /fp:precise，因为 fast-math 会摧毁精确性。"},
{f:"infinite-grid",t:"OpenCADStudio-main",ty:"design-reference",st:"active",w:5,n:"technical-plan.md:12 参考实现（实体风格）；另有两份专门移植文档 opencadstudio-architecture-reference.md 与 opencadstudio-render-modes-bgfx-plan.md。只读，禁抄（GPL-3.0）。"},
{f:"infinite-grid",t:"LNLib",ty:"decision-not-to-integrate",st:"closed",w:4,n:"technical-plan.md:112-119。决策：不集成。逐项自写而非引用 LNLib 代码，思路照搬《The NURBS Book》。仍列出的候选算法：节点向量工具、全局曲线插值、de Boor 求值、曲线-曲线求交、点-曲线投影。"},
{f:"infinite-grid",t:"Spatialite-5.1",ty:"decision-not-to-integrate",st:"closed",w:3,n:"technical-plan.md:126-128。决策：不配合 —— R-tree（range query 强）与 kd-tree（k-NN 强）职责正交，叠加两层空间索引等于常数因子双重惩罚。"},
{f:"infinite-grid",t:"simpline",ty:"validation-benchmark",st:"active",w:3,n:"technical-plan.md:12 拟合点插值验证基准。宿主此后已自行实现（3.5 节：Thomas 三对角 + Sherman-Morrison 周期变体、Newton 迭代在 Legendre 多项式上生成 24 点 Gauss-Legendre、16 项离线 MSVC 检查全过）。"},
{f:"infinite-grid",t:"large-coordinate-rendering",ty:"technique-reference",st:"active",w:4,n:"与宿主 Rebase+RTE 是同一种思想的两个层面。宿主实现：lib/coordinate/WorldRebase.h，chunkSize 1e4，chunk 锚定重定基原点，逐物体 uModelRelativePosition。"},
{f:"infinite-grid",t:"gl_cadscene_rendertechniques-master",ty:"technique-reference",st:"candidate",w:3,n:"文档未点名，但它是唯一的真桌面 OpenGL CAD 渲染器：draw call/状态削减、Hi-Z 遮挡剔除、双精度 CAD 矩阵拆分都直接对上宿主问题。"},
{f:"infinite-grid",t:"embree-master",ty:"technique-reference",st:"candidate",w:3,n:"文档未引用。可作为宿主 GPU ID-buffer 拾取的替代：CPU 光追精确拾取与遮挡。但这份拷贝被裁剪（缺 kernels/traverse 与 kernels/geom），尚未证明能构建。"},
{f:"infinite-grid",t:"meshoptimizer",ty:"technique-reference",st:"candidate",w:2,n:"文档未引用。候选用途：密集导入网格的 simplify + buildMeshlets，以及 optimizeVertexCache/Fetch 降低 OpenGL 绘制成本。必须限定在细分后的显示网格，绝不用于参数化特征几何。"},
{f:"predicates",t:"mcut",ty:"duplicate-symbols",st:"hazard",w:4,n:"mcut/source/shewchuk.c 内置了完全相同的公开域谓词。同时链接会在 orient2d/insphere 上撞名。MCUT 其实可以改为消费独立那份。"},
{f:"qaws",t:"simpline",ty:"subsumes",st:"active",w:3,n:"qaws 的弧长重参数化 + 等速遍历（S 曲线、11 种缓动、包裹模式）是 simpline 整个生态位的超集。"},
{f:"qaws",t:"arcs-0.3.0",ty:"overlaps",st:"active",w:2,n:"都做基于容差的曲线展平。arcs 用明确引用的 RDP + 弦高容差；qaws 用曲率加权自适应采样。"},
{f:"qaws",t:"LNLib",ty:"overlaps",st:"active",w:4,n:"全树共 4 个重叠的 NURBS/曲线库（qaws、LNLib、gbs、CAD-main 的单个 Bernstein 函数）。qaws 额外有 GLSL/HLSL/Halide 后端；LNLib 的 The NURBS Book 覆盖更全；gbs 多了 B-rep arena。"},
{f:"gbs",t:"LNLib",ty:"overlaps",st:"active",w:4,n:"同为 LGPL（2.1 vs 3.0），都完整实现 NURBS Book 的曲线+曲面+偏移+放样。gbs 额外提供原生 B-rep arena 与半边网格。"},
{f:"gbs",t:"qaws",ty:"overlaps",st:"active",w:3,n:"曲率/偏移/放样/求交重叠。gbs 有文档化算法与许可证；qaws 既无许可证也无构建系统。"},
{f:"CZY3DKernel-main",t:"cadcore-master",ty:"duplicate-technique",st:"active",w:5,n:"两者都用 DCEL 剖分 + In/On/Out 面组分类实现多面体布尔。CZY3DKernel 是 C++/绑定 OCCT；cadcore 是 Rust/无 OCCT，且明确把自身定位为 OCCT 的替代品。把两者并排读是判断「引 OCCT 还是自研内核」最便宜的方式。"},
{f:"KrisLibrary-master",t:"CZY3DKernel-main",ty:"duplicate-technique",st:"active",w:3,n:"都带一份 DCEL 实现（KrisLibrary geometry/DCEL.h vs CZY3DKernel CAD/Boolean/Topo.hxx）。"},
{f:"KrisLibrary-master",t:"gbs",ty:"duplicate-technique",st:"active",w:3,n:"都带半边网格（KrisLibrary TriMeshTopology/MarchingCubes vs gbs-mesh/halfedgemesh.h）。"},
{f:"CZY3DKernel-main",t:"gbs",ty:"duplicate-technique",st:"active",w:2,n:"都内置 KD-tree 与 R-tree（UTILS/KDtree,Rtree vs gbs 自带空间结构）。"},
{f:"LNLib",t:"gbs",ty:"duplicate-technique",st:"active",w:3,n:"空间索引在全树重复三次：LNLib Octree/Voronoi、KrisLibrary KDTree/BallTree、CZY3DKernel KDtree/Rtree。选一个，别都 vendor。"},
{f:"KrisLibrary-master",t:"CZY3DKernel-main",ty:"duplicate-technique",st:"active",w:2,n:"空间索引重叠（KDTree/BallTree vs KDtree/Rtree）。"},
{f:"tinygltf",t:"stb",ty:"depends-on-optional",st:"gap",w:4,n:"tiny_gltf.h 依赖 stb_image/stb_image_write 处理内嵌纹理，而两者就在同一个 external/ 树里 —— 但 tinygltf 的 CMakeLists 找不到 stb 的路径。逃生开关：TINYGLTF_NO_STB_IMAGE / TINYGLTF_NO_STB_IMAGE_WRITE。两者都没有 README。"},
{f:"meshoptimizer",t:"embree-master",ty:"producer-consumer",st:"candidate",w:3,n:"meshopt_buildMeshlets（法锥加权聚簇 + computeMeshletBounds）是 Embree 用 BVH4/BVH8 节点打包在消费侧解决的同一问题的生产侧。成立的链路：先抽稀+聚簇，再打进 Embree 场景。"},
{f:"openctm",t:"meshoptimizer",ty:"superseded-by",st:"active",w:2,n:"OpenCTM（2009，停更）在现代管线中已被 glTF + Draco + meshopt 取代；glTF 2.0 现在也带 EXT_meshopt_compression 路径，而 meshoptimizer 已在树内。"},
{f:"VulkanSceneGraph-master",t:"gl_cadscene_rendertechniques-master",ty:"alternative-approach",st:"active",w:4,n:"两者解决同一 CAD 问题（多零件装配的 draw call 与状态削减）但路径相反：VSG 用可移植的 RenderGraph 编译遍历；gl_cadscene 用 UBO 子区间绑定 + NVIDIA token 回放 + indexed MDI。两者都做遮挡剔除（VSG CullGroup/CullNode vs gl_cadscene Hi-Z + raster + 时间位），但只有 gl_cadscene 的文档详细到可以重实现。"},
{f:"VulkanSceneGraph-master",t:"OpenCADStudio-main",ty:"renderer-alternative",st:"active",w:2,n:"本树中三条渲染栈互斥：VSG = 仅 Vulkan，OpenCADStudio = wgpu（其 gl 路径是 GLES 转译而非桌面 GL），gl_cadscene = 真桌面 OpenGL。宿主是 OpenGL，只有 gl_cadscene 的代码能落下来。"},
{f:"gl_cadscene_rendertechniques-master",t:"VulkanSceneGraph-master",ty:"design-tension",st:"active",w:3,n:"VSG 保留可移植的 Object/Visitor/Switch/Bin/LOD 层级；gl_cadscene 刻意用扁平 NodeTree + 并行数组把这个层级换掉换速度。两面都值得读，正好是宿主 acgs 层架构选型的两面。"},
{f:"Quake3e-latest",t:"infinite-grid",ty:"algorithm-borrow",st:"candidate",w:2,n:"三个可借鉴点，全部 GPL-2 故只能重实现不可抄：大地图深度精度的反转 Z 缓冲（宿主改用 log-depth / DoubleSingle）、lightmap 图集合并、Zone 分配器的无 OOM 策略。除深度精度外均与 CAD 无关。"},
{f:"DB-CAD-master",t:"infinite-grid",ty:"architectural-antagonist",st:"informational",w:2,n:"持久化路线正相反：Neo4j 图存储 + FastAPI 服务层 vs 宿主的 SQLite + WAL + acdb 事务 + 有界撤销栈。仅可作为文档模型版本化（project→model→version）的对照案例。"},
{f:"CAD-main",t:"arcs-0.3.0",ty:"overlaps-architecture",st:"informational",w:2,n:"都用 ECS 拆解 CAD 场景（entt vs specs/shred）并把拾取做成一个 System。CAD-main 多了命令模式的组变换；arcs 多了用 euclid 做坐标系类型标注。"},
{f:"OpenGeode-master",t:"cadcore-master",ty:"alternative-approach",st:"active",w:2,n:"两者都是 MIT 的「从网格到 B-rep」框架但形态迥异：OpenGeode 是带卫星生态与 Python 绑定的模块框架；cadcore 是单个精确解析内核，带 slotmap arena 与 STEP 写出器。cadcore 额外记录了 AP214 流形不变式；OpenGeode 额外覆盖地学对象。"}
],

{id:"R5",sev:"medium",title:"OCCT 路线分叉未决",d:"CZY3DKernel 绑定 OCCT>=7.2；cadcore 明确把自己定位为 OCCT 替代品但只覆盖 sweep/半空间裁剪。宿主自建内核要不要引 OCCT，读这两个是最便宜的方式。",ps:["CZY3DKernel-main","cadcore-master"]},
{id:"R6",sev:"low",title:"资产管线缺口",d:"stb_image 不支持 DDS，tinygltf 也没有 DDS 路径。若资产管线要出 DirectX 表面格式需另找方案。tinygltf 的 CMake 也不知道同目录下 stb 在哪。",ps:["stb","tinygltf"]},
{id:"R7",sev:"low",title:"24 个项目里只有 1 个真的被编译",d:"CMakeLists.txt 只编译 external/predicates。其余 23 个处于 vendored-but-unwired 状态：既不进构建，也没有注释说明引入原因。建议要么接线要么删减，否则 external/ 会持续膨胀成无人维护的参考堆。",ps:["predicates"]}
]};

const CATNAME={robustness:"鲁棒性","mesh-processing":"网格处理",nurbs:"NURBS",utility:"工具库","cad-kernel":"CAD 内核","viewer-app":"观察器应用",renderer:"渲染器","scene-graph":"场景图","cad-app":"CAD 应用","ray-tracing":"光追","asset-io":"资产 IO","app-architecture":"应用架构",geospatial:"地理空间","game-engine":"游戏引擎","large-coordinate":"大坐标","mesh-io":"网格 IO","cad-data-layer":"CAD 数据层"};
const BKT={permissive:"可安全借鉴",weak_copyleft:"弱 copyleft",strong_copyleft:"强 copyleft 禁抄",unknown:"无许可证"};
const SEV={high:"高",medium:"中",low:"低"};
const relRank={"highest":0,high:1,"medium-high":2,"high-as-reference":3,medium:4,"low-medium":5,"low-medium (已决)":6,low:7,"low (已决)":8};

let fc={},sel=null;

function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function buildFilters(){
  const keys=["c","b","rel","hcls"];
  const labels={c:"类别",b:"许可",rel:"相关度",hcls:"状态"};
  const hostNames={"compiled-in":"已编译","closed":"已决策","ref":"仅参考"};
  const el=document.getElementById("filters");
  keys.forEach(k=>{
    const vals=[...new Set(DATA.projects.map(p=>p[k]))].sort();
    vals.forEach(v=>{
      const d=document.createElement("div");
      d.className="chip";d.dataset.k=k;d.dataset.v=v;
      let txt=v;
      if(k==="c")txt=CATNAME[v]||v;
      if(k==="b")txt=BKT[v]||v;
      if(k==="hcls")txt=hostNames[v]||v;
      d.textContent=txt;
      d.onclick=()=>{d.classList.toggle("on");fc[k]=d.classList.contains("on")?v:null;render();};
      el.appendChild(d);
    });
  });
  const r=document.createElement("div");
  r.className="chip";r.textContent="↺ 重置";r.style.borderColor="#58a6ff";
  r.onclick=()=>{fc={};document.querySelectorAll(".chip").forEach(x=>{if(x.dataset.k)x.classList.remove("on")});render();};
  el.appendChild(r);
}

function match(p,q){
  if(fc.c&&p.c!==fc.c)return false;
  if(fc.b&&p.b!==fc.b)return false;
  if(fc.hcls&&p.hcls!==fc.hcls)return false;
  if(fc.rel&&p.rel!==fc.rel)return false;
  if(!q)return true;
  q=q.toLowerCase();
  const hay=[p.id,p.n,p.d,p.l.join(" "),CATNAME[p.c]||p.c,BKT[p.b]||p.b,p.h,
    p.t.join(" "),p.cap.join(" "),p.alg.join(" "),p.dep.join(" "),p.bld].join(" ").toLowerCase();
  return hay.includes(q);
}

function hl(s,q){if(!q)return esc(s);const i=s.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return esc(s);return esc(s.slice(0,i))+'<span class="hi">'+esc(s.slice(i,i+q.length))+'</span>'+esc(s.slice(i+q.length));}

function render(){
  const q=document.getElementById("search").value.trim();
  const list=DATA.projects.filter(p=>match(p,q))
    .sort((a,b)=>(relRank[a.rel]??9)-(relRank[b.rel]??9));
  const box=document.getElementById("list");
  box.innerHTML=list.length?list.map(p=>{
    const lbl=(p.rel==="highest"?"★ ":p.rel.startsWith("high")?"★ ":"")+p.n;
    return '<div class="item'+(sel===p.id?" sel":"")+'" data-id="'+p.id+'">'+
      '<div class="t"><span>'+hl(lbl,q)+'</span><span class="dot b-'+p.b+'"></span></div>'+
      '<div class="m">'+hl(p.d,q)+'</div></div>';
  }).join(""):'<div id="empty">没有匹配的项目</div>';
  box.querySelectorAll(".item").forEach(el=>el.classList.toggle("sel",el.dataset.id===sel));
  if(sel&&!list.find(p=>p.id===sel)){sel=null;document.getElementById("detail").innerHTML='<div id="empty">← 从左侧选择一个项目</div>';}
}

function detail(id){
  const p=DATA.projects.find(x=>x.id===id);if(!p)return;
  const my=DATA.edges.filter(e=>e.f===id||e.t===id);
  const name=x=>{const o=DATA.projects.find(y=>y.id===x);return o?o.n:x;};
  const arrow=e=>e.f===id?("→ <b>"+name(e.t)+"</b>"):("← <b>"+name(e.f)+"</b>");
  const rs=DATA.risks.filter(r=>r.ps.includes(id));
  let h='<h2><span class="dot b-'+p.b+'"></span>'+esc(p.n)+
    '<span class="pill p-'+p.b+'">'+esc(BKT[p.b])+'</span>'+
    '<span class="badge">'+esc(p.lic)+'</span></h2>'+
    '<p style="color:#8b949e;margin:0 0 4px">'+esc(p.d)+'</p>'+
    '<p style="margin:6px 0 0"><span class="badge">'+esc(p.l.join(" · "))+'</span>'+
    '<span class="badge">'+esc(CATNAME[p.c]||p.c)+'</span>'+
    '<span class="badge">相关度 '+esc(p.rel)+'</span>'+
    '<span class="badge">宿主：'+esc(p.h)+'</span></p>'+
    '<div style="margin-top:8px">'+p.t.map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div>';

  h+='<h3>能力</h3><ul>'+p.cap.map(c=>'<li>'+esc(c)+'</li>').join("")+'</ul>';
  h+='<h3>关键算法</h3><ul>'+p.alg.map(c=>'<li>'+esc(c)+'</li>').join("")+'</ul>';
  h+='<h3>依赖</h3><ul>'+p.dep.map(c=>'<li>'+esc(c)+'</li>').join("")+'</ul>';
  h+='<h3>构建</h3><p style="margin:4px 0">'+esc(p.bld)+'</p>';
  if(my.length){
    h+='<h3>图谱关系（'+my.length+'）</h3>';
    h+=my.map(e=>'<div class="edge"><div class="ty">'+arrow(e)+' &nbsp;<span style="color:#8b949e">'+esc(e.ty)+'</span>'+
      ' <span class="badge">'+esc(e.st)+'</span></div><div class="nt">'+esc(e.n)+'</div></div>').join("");
  }
  if(rs.length){
    h+='<h3>涉及风险</h3>';
    h+=rs.map(r=>'<div class="edge" style="border-color:'+({high:"#f85149",medium:"#d29922",low:"#6e7681"}[r.sev])+'">'+
      '<div class="ty">'+esc(r.id)+' · '+SEV[r.sev]+' —— '+esc(r.title)+'</div>'+
      '<div class="nt">'+esc(r.d)+'</div></div>').join("");
  }
  h+='<h3>风险</h3><ul>'+p.rk.map(c=>'<li>'+esc(c)+'</li>').join("")+'</ul>';
  h+='<h3>证据路径</h3><div class="ev">'+p.ev.map(e=>esc(e)).join('<br>')+'</div>';
  document.getElementById("detail").innerHTML=h;
}

document.getElementById("search").addEventListener("input",render);
document.getElementById("list").addEventListener("click",e=>{
  const it=e.target.closest(".item");if(!it)return;
  sel=it.dataset.id;render();detail(sel);
});
buildFilters();
sel=DATA.projects[0].id;
render();
detail(sel);
</script>
</body>
</html>
